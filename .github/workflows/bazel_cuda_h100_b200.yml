name: CI - Bazel H100 and B200 CUDA tests
# The workflow runs if any of the following conditions are met:
# - H100 and B200 on Workflow dispatch.
# - H100 and B200 on scheduled every two hours.
# - H100 and B200 on PR to main that has the 'CI Optional GPU Presubmit' label.
on:
  # Runs on PR if label "CI Optional GPU Presubmit" is present.
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        required: true
        default: 'no'
        options:
        - 'yes'
        - 'no'
      python_version:
        description: 'Hermetic Python version for tests (for example, 3.14).'
        type: string
        required: true
        default: '3.14'
      xla_track:
        description: 'XLA revision used by tests.'
        type: choice
        required: true
        default: 'head'
        options:
        - 'pinned'
        - 'head'
        - 'commit'
      xla_commit:
        description: 'XLA commit SHA used by tests (only respected if xla_track is "commit").'
        type: string
        required: false
      jobs_to_run:
        description: 'Which jobs to run?'
        type: choice
        required: true
        default: 'all'
        options:
        - 'all'
        - 'single_b200'
        - 'multi_h100'
      bazel_targets:
        description: 'Custom Bazel targets to run (space-separated, overrides defaults)'
        type: string
        required: false
  pull_request:
    branches:
      - main
    types: [ labeled, synchronize, opened, reopened ]
  schedule:
    - cron: "0 */2 * * *" # Run every 2 hours
permissions: {}

# - For PRs, group by PR number and cancel stale in-progress runs.
# - For workflow_dispatch events, group by run_id so multiple dispatches can run in parallel.
# - Never cancel scheduled runs.
concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
        (github.event_name == 'pull_request'
         && format('pr-{0}', github.event.pull_request.number))

        || (github.event_name == 'workflow_dispatch'
            && format('dispatch-{0}', github.run_id))

        || format('ref-{0}', github.ref)
    }}
  cancel-in-progress: >-
    ${{
        github.ref != 'refs/heads/main' &&
        github.event_name == 'pull_request'
    }}

defaults:
  run:
    shell: bash

jobs:
  run_tests:
    if: >-
      ${{
          github.repository_owner == 'jax-ml'
          && github.event.repository.fork == false
          && (github.event_name == 'schedule'
              || (github.event_name == 'workflow_dispatch'
                  && (github.event.inputs.jobs_to_run == 'all'
                      || github.event.inputs.jobs_to_run == 'single_b200'))
              || contains(github.event.pull_request.labels.*.name,
                          'CI Optional GPU Presubmit'))
      }}
    runs-on: linux-x86-a4-224-b200-1gpu
    container: 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest'
    name: "Bazel single B200 CUDA tests"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Bazel single B200 CUDA Tests
        env:
          JAXCI_HERMETIC_PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.14' }}
          JAXCI_XLA_TRACK: ${{ github.event.inputs.xla_track || 'head' }}
          JAXCI_XLA_COMMIT: ${{ github.event.inputs.xla_commit }}
          # Keep broad single-accelerator coverage in this scheduled/optional job. The separate
          # blocking B200 presubmit intentionally remains limited to its fast Mosaic targets.
          JAXCI_BAZEL_TARGETS: |
            //tests:gpu_tests
            //tests:backend_independent_tests
            //tests/pallas:gpu_tests
            //tests/pallas:backend_independent_tests
            //tests/mosaic:gpu_tests
            //tests/mosaic:backend_independent_tests
          JAXCI_TEST_TAG_FILTERS: '-multiaccelerator'
          JAXCI_USE_PARALLEL_ACCELERATOR_RUNNER: '1'
          JAXCI_LOCAL_TEST_JOBS: '8'
          JAXCI_EXCLUDE_TEST_TARGETS: 'PmapTest.testSizeOverflow|.*InterpretTest.*'
          JAXCI_TEST_TIMEOUT: '420'
          CUSTOM_BAZEL_TARGETS: ${{ github.event.inputs.bazel_targets }}
        run: |
          if [[ -n "${CUSTOM_BAZEL_TARGETS}" ]]; then
            export JAXCI_BAZEL_TARGETS="${CUSTOM_BAZEL_TARGETS// /$'\n'}"
          fi
          bash ./ci/run_bazel_cuda_targeted_tests.sh
      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-test-artifacts
        with:
          artifact-name: bazel-cuda-h100-single
          inputs_json: ${{ toJSON(inputs) }}
          matrix_json: ${{ toJSON(matrix) }}
  run_multiaccelerator_tests:
    if: >-
      ${{
          github.repository_owner == 'jax-ml'
          && github.event.repository.fork == false
          && (
              github.event_name == 'schedule'
              || (github.event_name == 'workflow_dispatch'
                  && (github.event.inputs.jobs_to_run == 'all'
                      || github.event.inputs.jobs_to_run == 'multi_h100'))
              || contains(github.event.pull_request.labels.*.name,
                          'CI Optional GPU Presubmit')
          )
      }}
    runs-on: linux-x86-a3-8g-h100-8gpu
    container: 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest'
    name: "Bazel multiple H100 CUDA tests"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@9f8d7d8d9954430d0fef4a8cce2cb4e3844c200d
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Bazel multiple H100 CUDA Tests
        env:
          JAXCI_HERMETIC_PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.14' }}
          JAXCI_XLA_TRACK: ${{ github.event.inputs.xla_track || 'head' }}
          JAXCI_XLA_COMMIT: ${{ github.event.inputs.xla_commit }}
          JAXCI_BAZEL_TARGETS: |
            //tests/mosaic:gpu_tests
            //tests/pallas:gpu_tests
            //tests:array_interoperability_test_gpu
            //tests:cudnn_fusion_test_gpu
            //tests:fused_attention_stablehlo_test_gpu
            //tests:gpu_tests
            //tests:python_callback_test_gpu
            //tests:ragged_collective_test_gpu
            //tests/multiprocess:gpu_tests
            //jax/experimental/jax2tf/tests/multiprocess:gpu_tests
          JAXCI_TEST_TAG_FILTERS: 'multiaccelerator'
          # Every test selected by this job has the multiaccelerator tag and runs locally with all
          # eight H100s visible. Consequently, --local_test_jobs does not divide the GPUs among
          # independent tests: it permits that many multi-GPU test processes to contend for the
          # same eight devices. The shared resources include device memory and execution capacity,
          # NCCL communicators and collective engines, host memory, and CPU threads used by JAX/XLA
          # compilation. This is materially different from the single-B200 job above, where
          # parallel_accelerator_execute.sh assigns each single-GPU test process to the one B200.
          #
          # The June 29 revert at
          # https://github.com/jax-ml/jax/commit/3a99fe37b9719c07622a9b4ddc5a2200f1382535
          # also expanded the pool of tests eligible to run concurrently here. It undid the
          # short-lived split between the "multiaccelerator" and "multiaccelerator-only" tags,
          # returning tests that merely benefit from multiple accelerators and tests that require
          # them to the same "multiaccelerator" tag selected by this job. The commit did not change
          # --local_test_jobs itself, but combining those groups under the broad suite targets above
          # increased the number and variety of all-eight-GPU processes Bazel can overlap.
          #
          # With eight local H100 jobs, the ordinary main suite has shown contention rather than a
          # deterministic regression in one test. In run 30562061513, pjit_test_gpu took 244.6s and
          # fused_attention_stablehlo_multigpu_test_gpu timed out at 302.0s. In a focused but
          # otherwise faithful eight-job run (30564411237), those tests took 199.1s and 311.1s.
          # Which test approaches the timeout changes with its concurrently running neighbors. A
          # non-reverted one-job run of the same full suite (30578985195) reduced those times to
          # 95.4s and 79.4s, respectively. More aggressive repetition of pjit_test_gpu also caused
          # OOMs and crashes, consistent with an amplified form of the same resource contention.
          #
          # Four is an initial compromise: it halves the maximum number of all-eight-GPU test
          # processes while retaining useful suite-level parallelism. It is not a demonstrated
          # safety boundary. Reduce it again if timing artifacts still show a long tail or
          # resource-exhaustion failures.
          JAXCI_LOCAL_TEST_JOBS: '4'
          JAXCI_EXCLUDE_TEST_TARGETS: 'PmapTest.testSizeOverflow|.*InterpretTest.*'
          CUSTOM_BAZEL_TARGETS: ${{ github.event.inputs.bazel_targets }}
        run: |
          if [[ -n "${CUSTOM_BAZEL_TARGETS}" ]]; then
            export JAXCI_BAZEL_TARGETS="${CUSTOM_BAZEL_TARGETS// /$'\n'}"
          fi
          bash ./ci/run_bazel_cuda_targeted_tests.sh
      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-test-artifacts
        with:
          artifact-name: bazel-cuda-h100-multi
          inputs_json: ${{ toJSON(inputs) }}
          matrix_json: ${{ toJSON(matrix) }}
