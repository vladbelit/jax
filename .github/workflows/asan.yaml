name: CI - Address Sanitizer (nightly)

# - For PRs, group by PR number and cancel stale in-progress runs.
# - For workflow_dispatch events, group by actor+ref. Cancel stale in-progress runs from the same
#   actor on the same ref.
concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{
        (github.event_name == 'pull_request'
         && format('pr-{0}', github.event.pull_request.number))

        || (github.event_name == 'workflow_dispatch'
            && format('dispatch-{0}-{1}', github.actor, github.ref))

        || format('ref-{0}', github.ref)
    }}
  cancel-in-progress: >-
    ${{
        github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    }}

on:
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC
  workflow_dispatch: # Allows triggering the workflow run manually
    inputs:
      rbe:
        description: "Use RBE for testing (vs. local execution)"
        default: "1"
        type: choice
        options:
          - "1"
          - "0"

  pull_request: # Automatically trigger on pull requests affecting this file
    branches:
      - main
    paths:
      - ".github/workflows/asan.yaml"
permissions: {}

env:
  PYTHON_VERSION: "3.13"
  CPYTHON_URL: "https://storage.googleapis.com/ml-sysroot-testing/python/cpython-3.13.x-asan-shared-linux-x86_64-llvm-18.1.8.tar.gz"
  CPYTHON_SHA256: "cc7354abad5ab5b87aae3c870e510860c9ffefcd3d8f6c3e02129aaf9d30a5bb"
  CPYTHON_PREFIX: "cpython-3.13.x-asan-shared-linux-x86_64-llvm-18.1.8"

jobs:
  asan:
    # Don't execute in fork due to runner type
    if: github.repository == 'jax-ml/jax'
    runs-on: >-
      ${{ 
          (github.event_name != 'workflow_dispatch' || inputs.rbe == '1')
          && 'linux-x86-n4-16'
          || 'linux-x86-n4-64'
      }}
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build@sha256:ea67e8453d8b09c2ba48853da5e79efef4b65804b4a48dfae4b4da89ffd38405 # ml-build container (based on Ubuntu 22.04)
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: jax
          persist-credentials: false
      - name: Run tests under ASAN via Bazel
        timeout-minutes: 240
        env:
          ASAN_OPTIONS: detect_leaks=0
          JAX_NUM_GENERATED_CASES: 1
          JAX_ENABLE_X64: true
          JAX_SKIP_SLOW_TESTS: true
          # Default to RBE. Workflow dispatch can override to local execution.
          USE_RBE: "${{ (github.event_name != 'workflow_dispatch' || inputs.rbe == '1') && '1' || '0' }}"
          PY_COLORS: 1
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          set -x

          cd jax

          echo "ASAN_OPTIONS=${ASAN_OPTIONS}"
          echo "JAX_NUM_GENERATED_CASES=${JAX_NUM_GENERATED_CASES}"
          echo "JAX_ENABLE_X64=${JAX_ENABLE_X64}"
          echo "JAX_SKIP_SLOW_TESTS=${JAX_SKIP_SLOW_TESTS}"
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "USE_RBE=${USE_RBE}"

          test_targets=(
            //tests:cpu_tests
            //tests:backend_independent_tests
            //tests/multiprocess:cpu_tests
          )

          # A tiny set of light targets to run for quick iteration on changes.
          # test_targets=(
          #   //tests:device_test_cpu
          #   //tests:metadata_test_cpu
          # )

          if [[ "${USE_RBE}" == "1" ]]; then
            PLATFORM_CONFIG="rbe_linux_x86_64"
          else
            PLATFORM_CONFIG="ci_linux_x86_64"
          fi

          PROFILE_DIR="${PWD}/test-artifacts/bazel-profile"
          mkdir -p "${PROFILE_DIR}"

          echo "PLATFORM_CONFIG=${PLATFORM_CONFIG}"
          echo "Selected ASAN Bazel targets:"
          printf '  %s\n' "${test_targets[@]}"
          echo "Bazel profile directory: ${PROFILE_DIR}"

          bazel_status=0
          bazel test \
              --cache_test_results=false \
              --profile="${PROFILE_DIR}/command.profile.gz" \
              --experimental_announce_profile_path \
              --experimental_profile_include_primary_output \
              --experimental_profile_include_target_label \
              --experimental_profile_additional_tasks=action \
              --experimental_profile_additional_tasks=action_complete \
              --experimental_profile_additional_tasks=critical_path \
              --experimental_profile_additional_tasks=critical_path_component \
              --experimental_profile_additional_tasks=remote_queue \
              --experimental_profile_additional_tasks=remote_execution \
              --experimental_profile_additional_tasks=remote_process_time \
              --experimental_profile_additional_tasks=remote_cache_check \
              --experimental_profile_additional_tasks=remote_download \
              --experimental_profile_additional_tasks=remote_network \
              --experimental_profile_additional_tasks=upload_time \
              --experimental_profile_additional_tasks=wait \
              --build_event_publish_all_actions \
              --build_event_json_file="${PROFILE_DIR}/build-events.json" \
              --execution_log_json_file="${PROFILE_DIR}/execution-log.json" \
              --repo_env=HERMETIC_PYTHON_VERSION="${PYTHON_VERSION}" \
              --repo_env=HERMETIC_PYTHON_URL="${CPYTHON_URL}" \
              --repo_env=HERMETIC_PYTHON_SHA256="${CPYTHON_SHA256}" \
              --repo_env=HERMETIC_PYTHON_PREFIX="${CPYTHON_PREFIX}/" \
              --verbose_failures \
              --test_env=ASAN_OPTIONS="${ASAN_OPTIONS}" \
              --test_env=JAX_NUM_GENERATED_CASES="${JAX_NUM_GENERATED_CASES}" \
              --test_env=JAX_ENABLE_X64="${JAX_ENABLE_X64}" \
              --test_env=JAX_SKIP_SLOW_TESTS="${JAX_SKIP_SLOW_TESTS}" \
              --test_env=PY_COLORS="${PY_COLORS}" \
              --test_output=errors \
              --test_timeout=1800 \
              --config=${PLATFORM_CONFIG} \
              --config=asan_shared \
              --test_tag_filters=-noasan \
              --remote_download_regex='.*test\.xml$' \
              --show_progress_rate_limit=5 \
              "${test_targets[@]}" || bazel_status=$?

          ci/utilities/collect_bazel_test_xmls.sh test-artifacts || true

          if [[ -f "${PROFILE_DIR}/command.profile.gz" ]]; then
            echo "Bazel analyze-profile summary:"
            bazel analyze-profile "${PROFILE_DIR}/command.profile.gz" || true
          fi
          if [[ -f "${PROFILE_DIR}/execution-log.json" ]]; then
            gzip -f "${PROFILE_DIR}/execution-log.json"
          fi
          ls -lah "${PROFILE_DIR}" || true

          exit "${bazel_status}"

      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: ./jax/.github/actions/upload-test-artifacts
        with:
          test-artifacts-dir: jax/test-artifacts
          artifact-name: bazel-test-artifacts-asan-py${{ env.PYTHON_VERSION }}

      - name: Echo Bazel profile retrieval URIs
        if: always()
        env:
          GCS_UPLOAD_URI: gs://general-ml-ci-transient/jax-github-actions/jax/${{ github.workflow }}/${{ github.run_number }}/${{ github.run_attempt }}
          INPUT_ARTIFACT_NAME: bazel-test-artifacts-asan-py${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail

          printf -v padded_attempt "attempt%03d" "${{ github.run_attempt }}"
          artifact_name="${INPUT_ARTIFACT_NAME}-${padded_attempt}"
          artifact_uri="${GCS_UPLOAD_URI}/${artifact_name}"

          echo "Transient GCS artifact prefix:"
          echo "${artifact_uri}/"
          echo
          echo "Expected Bazel profile objects:"
          echo "${artifact_uri}/bazel-profile/command.profile.gz"
          echo "${artifact_uri}/bazel-profile/build-events.json"
          echo "${artifact_uri}/bazel-profile/execution-log.json.gz"
          echo
          echo "Anonymous read example:"
          echo "CLOUDSDK_AUTH_DISABLE_CREDENTIALS=true gcloud storage cat \"${artifact_uri}/bazel-profile/command.profile.gz\" > command.profile.gz"
